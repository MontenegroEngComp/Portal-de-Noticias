<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/index.css">

    <title>Portal de Notícias</title>
</head>
<body>

    <header class="container">
        <nav id="primary">
            <div>
                <img src="assets/icons/List.svg" alt="ícone de menu">
                <strong>Menu</strong>
            </div>

            <div>
                <img src="assets/logo.svg" alt="logo tech news">
            </div>

            <div>
                <strong>Buscar</strong>
                <img src="assets/icons/MagnifyingGlass.svg" alt="ícone de pesquisa">
            </div>

        </nav>

        <nav id="secondary" class="grid grid-flow-col">
            <a href="#">Inteligência Artificial</a>
            <a href="#">Blockchain</a>
            <a href="#">Hologramas</a>
            <a href="#">Internet</a>
            <a href="#">Vestíveis</a>
            <a href="#">Realidade Aumentada</a>
            <a href="#">Realidade Virtual</a>
        </nav>
    </header>

    <main class="grid container">
        <section id="featured" class="grid grid-flow-col gap-16">
            <div class="card">
                <img src="assets/images/Image 01.png" alt="1">

                <figcaption>
                    <span class="tag">Robótica</span>
                    <h2>Robôs domésticos começam a ser adotados para tarefas diárias, prometendo mais conforto e eficiência nas residências.</h2>
                </figcaption>
            </div>

            <div class="grid grid-cols-2 gap-16">
                <div class="card">
                    <img src="assets/images/Image 02.png" alt="2">

                    <figcaption>
                        <span class="tag">Hologramas</span>
                        <h3 class="line-clamp-3">Novo Smartphone Projetor 3D chega ao mercado, transformando a forma como vemos nossas telas!</h3>
                    </figcaption>
                </div>

                <div class="card">
                    <img src="assets/images/Image 03.png" alt="3">

                    <figcaption>
                        <span class="tag">Internet</span>
                        <h3 class="line-clamp-3">Tecnologia 6G chega às metrópoles brasileiras, prometendo revolucionar a forma como vivemos e nos comunicamos.</h3>
                    </figcaption>
                </div>

                <div class="card">
                    <img src="assets/images/Image 04.png" alt="4">

                    <figcaption>
                        <span class="tag">Vestíveis</span>
                        <h3 class="line-clamp-3">Empresa lança relógio inteligente capaz de monitorar a saúde mental, oferecendo insights valiosos para o bem-estar pessoal.</h3>
                    </figcaption>
                </div>

                <div class="card">
                    <img src="assets/images/Image 05.png" alt="5">

                    <figcaption>
                        <span class="tag">Realidade Virtual</span>
                        <h3 class="line-clamp-3">Escolas adotam a tecnologia VR para proporcionar experiências imersivas, transformando a aprendizagem tradicional.</h3>
                    </figcaption>
                </div>
            </div>
        </section>

    </main>
    
</body>
</html>
